version: '3.8'

services:
  api:
    build: ./backend
    container_name: pymedb-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:pass@db:5432/pymedb
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=tu-clave-secreta-super-segura
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - WOMPI_API_KEY=pub_test_xxxxx
      - WOMPI_API_URL=https://api-sandbox.wompi.co
      - SALESFORCE_API_KEY=xxxxx
      - SALESFORCE_API_URL=https://login.salesforce.com
      - SENDGRID_API_KEY=SG.xxxxx
      - SENDGRID_FROM_EMAIL=no-reply@tudominio.com
      - GA_TRACKING_ID=G-XXXXXXXXXX
      - AWS_ACCESS_KEY_ID=AKIAIOSFODNN7
      - AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI
      - AWS_REGION=us-east-1
      - CLOUDWATCH_LOG_GROUP=/aws/fastapi/pymedb
      - ENVIRONMENT=development
      - DEBUG=true
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:15-alpine
    container_name: pymedb-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=pymedb
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pymedb-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  celery_worker:
    build: ./backend
    container_name: pymedb-celery
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:pass@db:5432/pymedb
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    command: celery -A app.tasks worker --loglevel=info --concurrency=4

  frontend:
    build: ./frontend
    container_name: pymedb-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WOMPI_PUBLIC_KEY=pub_test_xxxxx
      - VITE_WOMPI_API_URL=https://api-sandbox.wompi.co
      - VITE_GA_TRACKING_ID=G-XXXXXXXXXX
      - VITE_APP_NAME=PyMEs Platform
      - VITE_APP_URL=http://localhost:3000
    volumes:
      - ./frontend:/app
    depends_on:
      - api
    command: npm run dev -- --host 0.0.0.0 --port 3000

volumes:
  postgres_data:
  redis_data:
